name: Bug report
description: Something does not work or gives a wrong result.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Short answers are fine.
        You can write in **English or German**.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: |
        I opened a Fanuc program and used "Renumber Blocks".
        The GOTO in line 120 still points to the old block number.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The GOTO should point to the new number N250.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      description: If you can, list the steps. Then we can see the problem ourselves.
      placeholder: |
        1. Open the file
        2. Click …
        3. See …

  - type: dropdown
    id: control
    attributes:
      label: Control / dialect
      description: Which control is the program for? Leave empty if it does not matter.
      options:
        - Fanuc (ISO) – milling
        - Fanuc (ISO) – turning
        - Heidenhain Klartext
        - Okuma OSP
        - Sinumerik 840D – milling
        - Sinumerik 840D – turning
        - Hurco
        - Haas
        - Other (please write it below)

  - type: textarea
    id: program
    attributes:
      label: Example program (optional)
      description: |
        A few lines of NC code that show the problem help most.
        **Before you paste: remove customer names, part numbers, drawing numbers and anything else that is secret.**
        Only the lines around the problem are needed – not the whole program.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version do you use? You find it in the About window.
      placeholder: "1.0.0"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Does not matter

  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, error messages, your machine – drag files into this box.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: I removed customer names, part numbers and other secret data from the code and screenshots.
          required: true
